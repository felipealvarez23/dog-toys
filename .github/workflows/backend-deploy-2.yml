name: Deploy Reservation App to AWS Fargate
on:
  push:
    branches:
      - trunk
    paths:
      - reservations/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_GITHUB_OIDC_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Debug identity (opcional pero útil)
        run: aws sts get-caller-identity

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew
        working-directory: reservations

      - name: Build JAR with Gradle
        run: ./gradlew clean build -x test
        working-directory: reservations

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image
        id: build-image
        run: |
          DATE=$(date +'%Y%m%d')
          IMAGE_TAG=reservation-${DATE}.${GITHUB_RUN_NUMBER}
          
          # Compilamos la imagen localmente
          docker build -t reservation-app:$IMAGE_TAG .
          
          docker tag reservation-app:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG
          
          # Subimos a AWS ECR
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG
          
          # Guardamos el output para que lo lea el envsubst en el paso de abajo
          echo "image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
        working-directory: reservations

      - name: Prepare task definition
        env:
          AWS_ECS_EXECUTION_ROLE_ARN: ${{ secrets.AWS_ECS_EXECUTION_ROLE_ARN }}
          AWS_SECRETMAN_RDS_ARN: ${{ secrets.AWS_SECRETMAN_RDS_ARN }}
          AWS_SECRET_DB_USERNAME_ARN: ${{ secrets.AWS_SECRET_DB_USERNAME_ARN }}
          AWS_SECRET_DB_PASSWORD_ARN: ${{ secrets.AWS_SECRET_DB_PASSWORD_ARN }}
          AWS_ECS_TASK_CPU: ${{ vars.AWS_ECS_TASK_CPU }}
          AWS_ECS_TASK_MEMORY: ${{ vars.AWS_ECS_TASK_MEMORY }}
          RDS_DB_HOST: ${{ vars.RDS_DB_HOST }}
          AWS_RDS_DB_PORT: ${{ vars.AWS_RDS_DB_PORT }}
          RDS_DB_NAME: ${{ vars.RDS_DB_NAME }}
          RDS_DB_SCHEMA: ${{ vars.RDS_DB_SCHEMA }}
          CONTAINER_NAME: 'reservation-app'
          AWS_ECR_IMAGE_URL: ${{ steps.build-image.outputs.image }} # Tomado del output de arriba 🪄
        run: |
          # Sustitución limpia de variables en el archivo JSON
          envsubst '$AWS_ECS_EXECUTION_ROLE_ARN,$AWS_SECRETMAN_RDS_ARN,$AWS_ECS_TASK_CPU,$AWS_ECS_TASK_MEMORY,$AWS_RDS_DB_HOST,$AWS_RDS_DB_PORT,$AWS_RDS_DB_NAME,$AWS_RDS_DB_SCHEMA,$CONTAINER_NAME,$AWS_ECR_IMAGE_URL' < task-definition.json > task-def.json
        working-directory: reservations

      - name: Deploy to Amazon ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          # Registra este archivo modificado en AWS ECS
          task-definition: reservations/task-def.json
          # El nombre de tu servicio de Fargate en AWS (Puedes usar una variable si cambia)
          service: ${{ vars.ECS_SERVICE }}
          # El nombre de tu clúster de ECS en AWS (Puedes usar una variable si cambia)
          cluster: ${{ vars.ECS_CLUSTER }}
          # GitHub esperará hasta que los contenedores viejos se apaguen y los nuevos estén estables
          wait-for-service-stability: true